<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Ledger — Calorie & Protein Tracker</title>
<style>
  :root{
    --ink:#14140f;
    --paper:#faf9f4;
    --paper-2:#f1efe6;
    --line:#14140f;
    --green:#1b4332;
    --amber:#c1701a;
    --red:#a2321f;
    --blue:#2b4a63;
    --muted:#6b6a5f;
    --radius:2px;
    --r-green:#2f8f4e;
    --r-lgreen:#8bc34a;
    --r-yellow:#c9a227;
    --r-orange:#e0791e;
    --r-red:#c62828;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-2);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .narrow{
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, sans-serif;
    font-stretch: condensed;
  }
  header.app-header{
    padding: max(18px, env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
    max-width:480px; margin:0 auto;
  }
  header.app-header h1{
    font-size:15px; letter-spacing:2px; text-transform:uppercase; margin:0;
    font-weight:800;
  }
  header.app-header .date-nav{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--muted); font-weight:600;
  }
  header.app-header button.nav-btn{
    background:none; border:none; font-size:18px; color:var(--ink);
    padding:2px 6px; cursor:pointer; line-height:1;
  }
  main{max-width:480px; margin:0 auto; padding:0 16px;}

  .label-card{
    background:var(--paper);
    border: 3px solid var(--line);
    border-radius: var(--radius);
    padding:14px 16px 16px;
    margin-bottom:18px;
  }
  .label-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .label-title{
    font-size:26px; font-weight:900; letter-spacing:-0.5px;
    margin:0 0 2px;
  }
  .status-badge{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px;
    padding:5px 9px; border-radius:20px; border:1.5px solid var(--ink);
    white-space:nowrap; margin-top:4px;
  }
  .status-badge.cutting{background:var(--blue); color:var(--paper); border-color:var(--blue);}
  .status-badge.excess{background:var(--red); color:var(--paper); border-color:var(--red);}
  .status-badge.ontrack{background:var(--green); color:var(--paper); border-color:var(--green);}
  .status-badge.none{background:transparent; color:var(--muted); border-color:var(--muted);}
  .status-badge.losing{background:var(--red); color:var(--paper); border-color:var(--red);}
  .status-badge.excessprotein{background:var(--blue); color:var(--paper); border-color:var(--blue);}
  .status-badge.small{font-size:9.5px; padding:4px 8px;}

  .label-sub{
    font-size:12px; color:var(--muted); margin:0 0 8px;
    border-bottom: 8px solid var(--line);
    padding-bottom:8px;
  }
  .row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 0; border-bottom:1px solid var(--ink);
  }
  .row.thick{border-bottom:4px solid var(--line);}
  .row.total{border-bottom:1px solid var(--ink); padding-top:8px;}
  .row.protein{border-bottom:none;}
  .row .label{font-weight:700; font-size:15px;}
  .row .val{font-weight:800; font-size:16px;}
  .row.total .label{font-size:19px; font-weight:900;}
  .row.total .val{font-size:26px; font-weight:900;}
  .row.total .val.over{color:var(--red);}
  .row.total .val.under{color:var(--green);}
  .row.protein .label{font-size:14px; color:var(--muted); font-weight:700;}
  .row.protein .val{font-size:15px; color:var(--blue);}

  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin:4px 0 14px;
  }
  .stat-box{
    background:var(--paper-2); border:1px solid var(--ink); border-radius:var(--radius);
    padding:10px 12px;
  }
  .stat-box.full{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;}
  .stat-box.full .stat-label{margin-bottom:0;}
  .stat-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--muted); font-weight:800; margin-bottom:4px;
  }
  .stat-value{font-size:24px; font-weight:900; line-height:1.1;}
  .stat-value.over{color:var(--red);}
  .stat-value.under{color:var(--green);}
  .stat-value.burned{font-size:20px; color:var(--amber);}
  .stat-value small{font-size:13px; font-weight:700;}

  .bar-label{font-size:10.5px; color:var(--muted); font-weight:700; margin-top:8px; margin-bottom:4px;}
  .bar-label-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; margin-bottom:4px;
  }
  .bar-label-row .bar-label{margin:0;}
  .bar-track{
    height:10px; background:var(--paper-2); border:1px solid var(--ink); border-radius:6px;
    overflow:hidden; margin:0 0 4px;
  }
  .bar-fill{height:100%; background:var(--green); transition:width .35s ease, background .35s ease;}
  .bar-fill.over{background:var(--red);}
  .bar-fill.protein-fill{background:var(--blue);}
  .bar-caption{font-size:11px; color:var(--muted); text-align:right;}

  .ranges{
    display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted);
    margin-top:2px; font-weight:600;
  }

  .settings-toggle{text-align:right; margin-top:10px;}
  .settings-toggle button{
    background:none; border:none; color:var(--muted); font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; padding:4px 0;
  }
  .settings-panel{
    margin-top:8px; padding-top:10px; border-top:1px dashed #ccc7b3;
    display:none;
  }
  .settings-panel.open{display:block;}
  .setting-row{
    display:flex; align-items:center; justify-content:space-between; padding:5px 0;
    font-size:12.5px; color:var(--muted); font-weight:600;
  }
  .setting-row input{
    width:66px; text-align:right; border:none; border-bottom:1px solid var(--muted);
    background:transparent; font-size:13px; font-weight:700; color:var(--ink);
    font-family:inherit; padding:2px 0;
  }
  .setting-row input:focus{outline:none; border-bottom-color:var(--ink);}

  .add-card{
    background:var(--paper); border:1px solid var(--ink); border-radius:var(--radius);
    padding:14px; margin-bottom:18px;
  }
  .add-card h2{
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 10px; color:var(--muted);
  }
  .quick-add{margin-bottom:12px;}
  .quick-add label{
    display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--muted); margin-bottom:5px; font-weight:700;
  }
  .quick-add select{
    width:100%; font-family:inherit; border:1px solid var(--ink); border-radius:var(--radius);
    padding:10px 10px; font-size:14.5px; background:var(--paper-2); color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%2314140f' d='M5 7l5 6 5-6z'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; background-size:16px;
  }
  .quick-add select:focus{outline:2px solid var(--green); outline-offset:-1px;}
  .manage-toggle{margin:2px 0 0; text-align:right;}
  .manage-toggle button{
    background:none; border:none; color:var(--muted); font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; padding:4px 0;
  }
  .custom-form{
    background:var(--paper-2); border:1px dashed var(--ink); border-radius:var(--radius);
    padding:12px; margin-top:10px;
  }
  .custom-form .form-title{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; color:var(--ink);}
  .custom-form .add-row{margin-bottom:8px;}
  .form-btns{display:flex; gap:8px; margin-top:10px;}
  .form-btns button{
    flex:1; padding:11px; border-radius:var(--radius); font-size:12.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:1px solid var(--ink);
  }
  .form-btns .save-btn, .form-btns .add-btn{background:var(--ink); color:var(--paper); margin-top:0;}
  .form-btns .cancel-btn{background:transparent; color:var(--ink);}
  .custom-list{margin-top:10px;}
  .custom-list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 2px; border-bottom:1px solid #ddd9c8; font-size:13px;
  }
  .custom-list-item .ci-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .custom-list-item .ci-macro{font-size:11px; color:var(--muted); font-weight:600;}
  .custom-list-item .ci-actions{display:flex; gap:6px; flex-shrink:0; margin-left:8px;}
  .custom-list-item .ci-actions button{
    background:none; border:none; color:var(--muted); font-size:14px; padding:3px 5px; cursor:pointer;
  }
  .custom-list-item .ci-actions button.ci-del:active{color:var(--red);}
  .custom-list-item .ci-actions button.ci-edit:active{color:var(--blue);}
  .divider-word{
    display:flex; align-items:center; gap:8px; margin:12px 0;
    font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700;
  }
  .divider-word::before, .divider-word::after{content:""; flex:1; height:1px; background:#ddd9c8;}
  .add-row{display:flex; gap:8px;}
  .add-row input{
    font-family:inherit; border:1px solid var(--ink); border-radius:var(--radius);
    padding:10px 10px; font-size:15px; background:var(--paper-2);
  }
  .add-row input:focus{outline:2px solid var(--green); outline-offset:-1px;}
  .add-row input.name{flex:1.4; min-width:0;}
  .add-row input.qty{width:56px;}
  .add-row input.cals{width:60px;}
  .add-row input.protein{width:60px;}
  .add-row-labels{display:flex; gap:8px; margin-top:4px;}
  .add-row-labels span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .add-row-labels span.name{flex:1.4;}
  .add-row-labels span.qty{width:56px; text-align:center;}
  .add-row-labels span.cals{width:60px; text-align:center;}
  .add-row-labels span.protein{width:60px; text-align:center;}
  .qty-hint{font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .add-btn{
    margin-top:10px; width:100%; padding:11px; background:var(--ink); color:var(--paper);
    border:none; border-radius:var(--radius); font-size:14px; font-weight:800;
    letter-spacing:0.5px; text-transform:uppercase; cursor:pointer;
  }
  .add-btn:active{opacity:0.8;}

  .log-header{display:flex; justify-content:space-between; align-items:baseline; margin:0 0 8px;}
  .log-header h2{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; margin:0; color:var(--muted);}
  .log-header .count{font-size:11px; color:var(--muted);}
  ul.entries{list-style:none; margin:0 0 8px; padding:0;}
  ul.entries li{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px; border-bottom:1px solid #ddd9c8; gap:8px;
  }
  ul.entries li .info{min-width:0;}
  ul.entries li .name{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  ul.entries li .time{font-size:11px; color:var(--muted); margin-top:2px;}
  ul.entries li .macros{font-size:11px; color:var(--blue); margin-top:2px; font-weight:700;}
  ul.entries li .ratio{font-weight:800;}
  ul.entries li .ratio.r-green{color:var(--r-green);}
  ul.entries li .ratio.r-lgreen{color:var(--r-lgreen);}
  ul.entries li .ratio.r-yellow{color:var(--r-yellow);}
  ul.entries li .ratio.r-orange{color:var(--r-orange);}
  ul.entries li .ratio.r-red{color:var(--r-red);}
  ul.entries li .right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  ul.entries li .cal{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  ul.entries li button.del{
    background:none; border:none; color:var(--muted); font-size:18px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  ul.entries li button.edit-entry{
    background:none; border:none; color:var(--muted); font-size:15px; padding:4px 5px; cursor:pointer; line-height:1;
  }
  ul.entries li button.edit-entry:active{color:var(--blue);}
  ul.entries li button.del:active{color:var(--red);}
  ul.entries li .cal.burn{color:var(--amber);}

  .exercise-card{
    background:var(--paper); border:1px solid var(--amber); border-radius:var(--radius);
    padding:14px; margin-bottom:18px;
  }
  .exercise-card h2{
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 10px; color:var(--amber);
  }
  .exercise-card .add-row input:focus{outline:2px solid var(--amber); outline-offset:-1px;}
  .exercise-card .add-btn{background:var(--amber);}

  .empty{text-align:center; padding:30px 10px; color:var(--muted); font-size:13px;}
  .empty.small{padding:16px 10px; font-size:12.5px;}
  .empty .glyph{font-size:26px; display:block; margin-bottom:8px;}
  .loading{text-align:center; padding:40px 10px; color:var(--muted); font-size:13px;}

  .history-btn{
    background:none; border:1px solid var(--ink); border-radius:20px;
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
    padding:5px 11px; cursor:pointer; color:var(--ink);
  }
  .history-btn:active{opacity:0.7;}
  .month-group{margin-bottom:20px;}
  .month-title{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); margin:0 0 6px; padding-bottom:6px; border-bottom:2px solid var(--ink);
  }
  .hist-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid #ddd9c8; cursor:pointer;
  }
  .hist-row:active{background:var(--paper);}
  .hist-row .hd-date{font-size:14px; font-weight:700;}
  .hist-row .hd-dow{font-size:11px; color:var(--muted); font-weight:600;}
  .hist-row .hd-right{display:flex; align-items:center; gap:10px;}
  .hist-row .hd-macro{font-size:11px; color:var(--muted); text-align:right;}
  .hist-row .hd-cal{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .hist-badge{
    font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
    padding:3px 7px; border-radius:20px; border:1.5px solid var(--ink); white-space:nowrap;
  }
  .hist-badge.cutting{background:var(--blue); color:var(--paper); border-color:var(--blue);}
  .hist-badge.excess{background:var(--red); color:var(--paper); border-color:var(--red);}
  .hist-badge.ontrack{background:var(--green); color:var(--paper); border-color:var(--green);}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:6px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="app-header">
  <h1>Ledger</h1>
  <div class="date-nav" id="headerRight">
    <button class="nav-btn" id="prevDay" aria-label="Previous day">‹</button>
    <span id="dateLabel">Today</span>
    <button class="nav-btn" id="nextDay" aria-label="Next day">›</button>
  </div>
</header>

<main id="main">
  <div class="loading" id="loadingMsg">Loading your day…</div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (s, el=document) => el.querySelector(s);
  const main = $('#main');
  const toastEl = $('#toast');

  const STORAGE_PREFIX = 'ledger:';
  const storage = {
    async get(key){
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      if(raw === null) return null;
      return {key, value: raw};
    },
    async set(key, value){
      localStorage.setItem(STORAGE_PREFIX + key, value);
      return {key, value};
    },
    async delete(key){
      localStorage.removeItem(STORAGE_PREFIX + key);
      return {key, deleted:true};
    },
    async list(prefix){
      const keys = [];
      const p = STORAGE_PREFIX + (prefix || '');
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(p)) keys.push(k.slice(STORAGE_PREFIX.length));
      }
      return {keys, prefix};
    }
  };

  let currentDate = new Date();
  currentDate.setHours(0,0,0,0);
  let goal = 2000;
  let proteinGoal = 120;
  let cuttingLine = 1500;
  let excessLine = 2000;
  let proteinLowLine = 80;
  let proteinHighLine = 200;
  let entries = [];
  let exerciseEntries = [];
  let settingsOpen = false;
  let customFoods = [];
  let customFormOpen = false;
  let editingCustomId = null;
  let manageOpen = false;
  let customEditValues = {name:'', calories:'', protein:''};
  let editingEntryId = null;
  let entryEditValues = {name:'', calories:'', protein:''};
  let view = 'log';
  let daySummaries = {};

  function commonFoodsOptionsHtml(){
    if(!customFoods.length) return '';
    const sorted = customFoods.slice().sort((a,b) => a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));
    return `
      <optgroup label="My Items">
        ${sorted.map(it => `<option value="${escapeHtml(it.name)}" data-cal="${it.calories}" data-protein="${it.protein}">${escapeHtml(it.name)} — ${it.calories} cal / ${it.protein}g</option>`).join('')}
      </optgroup>
    `;
  }

  async function loadCustomFoods(){
    try{
      const res = await storage.get('customFoods');
      customFoods = (res && res.value) ? JSON.parse(res.value) : [];
    }catch(e){
      customFoods = [];
    }
  }
  async function saveCustomFoods(){
    try{
      await storage.set('customFoods', JSON.stringify(customFoods));
    }catch(e){
      console.error('Failed to save custom foods', e);
      showToast("Couldn't save item");
    }
  }

  function fmtDateKey(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function isToday(d){
    const t = new Date(); t.setHours(0,0,0,0);
    return fmtDateKey(d) === fmtDateKey(t);
  }
  function isYesterday(d){
    const t = new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate()-1);
    return fmtDateKey(d) === fmtDateKey(t);
  }
  function dateLabel(d){
    if(isToday(d)) return 'Today';
    if(isYesterday(d)) return 'Yesterday';
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }
  function timeLabel(iso){
    try{ return new Date(iso).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  async function loadSettings(){
    try{
      const res = await storage.get('settings');
      if(res && res.value){
        const s = JSON.parse(res.value);
        if(s.goal > 0) goal = s.goal;
        if(s.proteinGoal >= 0) proteinGoal = s.proteinGoal;
        if(s.cuttingLine >= 0) cuttingLine = s.cuttingLine;
        if(s.excessLine >= 0) excessLine = s.excessLine;
        if(s.proteinLowLine >= 0) proteinLowLine = s.proteinLowLine;
        if(s.proteinHighLine >= 0) proteinHighLine = s.proteinHighLine;
      }
    }catch(e){ }
  }
  async function saveSettings(){
    try{
      await storage.set('settings', JSON.stringify({goal, proteinGoal, cuttingLine, excessLine, proteinLowLine, proteinHighLine}));
    }catch(e){ console.error('Failed to save settings', e); showToast("Couldn't save settings"); }
  }
  async function loadEntries(){
    const key = 'entries:' + fmtDateKey(currentDate);
    try{
      const res = await storage.get(key);
      entries = (res && res.value) ? JSON.parse(res.value) : [];
      entries.forEach(e => { if(typeof e.protein !== 'number' || isNaN(e.protein)) e.protein = 0; });
    }catch(e){
      entries = [];
    }
  }
  async function saveEntries(){
    const key = 'entries:' + fmtDateKey(currentDate);
    try{
      await storage.set(key, JSON.stringify(entries));
    }catch(e){
      console.error('Failed to save entries', e);
      showToast("Couldn't save — try again");
    }
    await updateDaySummary();
  }

  async function loadExerciseEntries(){
    const key = 'exercise:' + fmtDateKey(currentDate);
    try{
      const res = await storage.get(key);
      exerciseEntries = (res && res.value) ? JSON.parse(res.value) : [];
    }catch(e){
      exerciseEntries = [];
    }
  }
  async function saveExerciseEntries(){
    const key = 'exercise:' + fmtDateKey(currentDate);
    try{
      await storage.set(key, JSON.stringify(exerciseEntries));
    }catch(e){
      console.error('Failed to save exercise entries', e);
      showToast("Couldn't save — try again");
    }
    await updateDaySummary();
  }

  async function loadDaySummaries(){
    try{
      const res = await storage.get('daySummaries');
      daySummaries = (res && res.value) ? JSON.parse(res.value) : {};
    }catch(e){
      daySummaries = {};
    }
  }
  async function saveDaySummaries(){
    try{
      await storage.set('daySummaries', JSON.stringify(daySummaries));
    }catch(e){
      console.error('Failed to save day summaries', e);
    }
  }
  async function updateDaySummary(){
    const key = fmtDateKey(currentDate);
    const total = entries.reduce((sum, e) => sum + e.calories, 0);
    const totalProtein = entries.reduce((sum, e) => sum + (e.protein || 0), 0);
    const totalBurned = exerciseEntries.reduce((sum, e) => sum + e.calories, 0);
    if(entries.length === 0 && exerciseEntries.length === 0){
      delete daySummaries[key];
    } else {
      daySummaries[key] = {calories: total, protein: totalProtein, burned: totalBurned};
    }
    await saveDaySummaries();
  }

  function statusFor(netTotal){
    if(netTotal <= 0) return {cls:'none', text:'No entries'};
    if(netTotal > excessLine) return {cls:'excess', text:'Excess Calories'};
    if(netTotal < cuttingLine) return {cls:'cutting', text:'Cutting'};
    return {cls:'ontrack', text:'On track'};
  }

  function statusForProtein(totalProtein){
    if(totalProtein <= 0) return {cls:'none', text:'No entries'};
    if(totalProtein > proteinHighLine) return {cls:'excessprotein', text:'Excess Protein'};
    if(totalProtein < proteinLowLine) return {cls:'losing', text:'Losing Muscle'};
    return {cls:'ontrack', text:'On track'};
  }

  function ratioInfo(cal, protein){
    if(!protein || protein <= 0) return null;
    const ratio = Math.round(cal / protein);
    let cls;
    if(ratio <= 10) cls = 'r-green';
    else if(ratio <= 20) cls = 'r-lgreen';
    else if(ratio <= 30) cls = 'r-yellow';
    else if(ratio <= 40) cls = 'r-orange';
    else cls = 'r-red';
    return {ratio, cls};
  }

  async function reconcileMissingSummaries(){
    try{
      const foodList = await storage.list('entries:');
      const exList = await storage.list('exercise:');
      const dateKeys = new Set();
      (foodList && foodList.keys ? foodList.keys : []).forEach(k => dateKeys.add(k.slice('entries:'.length)));
      (exList && exList.keys ? exList.keys : []).forEach(k => dateKeys.add(k.slice('exercise:'.length)));

      let changed = false;
      for(const dateKey of dateKeys){
        if(daySummaries[dateKey] !== undefined) continue;
        try{
          const foodRes = await storage.get('entries:' + dateKey);
          const dayEntries = (foodRes && foodRes.value) ? JSON.parse(foodRes.value) : [];
          const exRes = await storage.get('exercise:' + dateKey);
          const dayExercise = (exRes && exRes.value) ? JSON.parse(exRes.value) : [];
          if(dayEntries.length || dayExercise.length){
            const cal = dayEntries.reduce((s,e)=> s + (e.calories||0), 0);
            const prot = dayEntries.reduce((s,e)=> s + (e.protein||0), 0);
            const burned = dayExercise.reduce((s,e)=> s + (e.calories||0), 0);
            daySummaries[dateKey] = {calories: cal, protein: prot, burned: burned};
            changed = true;
          }
        }catch(e){ }
      }
      if(changed) await saveDaySummaries();
    }catch(e){
      console.error('Failed to reconcile history', e);
    }
  }

  function renderHistory(){
    const dateKeys = Object.keys(daySummaries).sort().reverse();

    if(dateKeys.length === 0){
      main.innerHTML = `<div class="empty"><span class="glyph">📅</span>No history yet.<br>Log a few days and they'll show up here.</div>`;
      return;
    }

    const monthGroups = {};
    dateKeys.forEach(k => {
      const monthKey = k.slice(0,7);
      if(!monthGroups[monthKey]) monthGroups[monthKey] = [];
      monthGroups[monthKey].push(k);
    });

    const monthTitle = (monthKey) => {
      const [y,m] = monthKey.split('-').map(Number);
      return new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
    };
    const rowDate = (k) => {
      const [y,m,d] = k.split('-').map(Number);
      const dt = new Date(y, m-1, d);
      return {
        date: dt.toLocaleDateString(undefined, {month:'short', day:'numeric'}),
        dow: dt.toLocaleDateString(undefined, {weekday:'short'})
      };
    };

    main.innerHTML = Object.keys(monthGroups).map(monthKey => `
      <div class="month-group">
        <div class="month-title">${monthTitle(monthKey)}</div>
        ${monthGroups[monthKey].map(k => {
          const s = daySummaries[k];
          const burned = s.burned || 0;
          const net = s.calories - burned;
          const rd = rowDate(k);
          const status = statusFor(net);
          return `
            <div class="hist-row" data-date="${k}">
              <div>
                <div class="hd-date">${rd.date}</div>
                <div class="hd-dow">${rd.dow}</div>
              </div>
              <div class="hd-right">
                <div class="hd-macro">${s.protein}g protein${burned ? ` &middot; -${burned} burned` : ''}</div>
                <span class="hist-badge ${status.cls}">${status.text}</span>
                <span class="hd-cal">${net}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('');
  }

  function wireHistoryEvents(){
    $('#closeHistoryBtn').addEventListener('click', () => { view = 'log'; render(); });
    main.querySelectorAll('.hist-row').forEach(row => {
      row.addEventListener('click', async () => {
        const [y,m,d] = row.dataset.date.split('-').map(Number);
        currentDate = new Date(y, m-1, d);
        view = 'log';
        main.innerHTML = '<div class="loading">Loading…</div>';
        await loadEntries();
        await loadExerciseEntries();
        render();

    const name = nameInput.value.trim();
    const qtyRaw = parseFloat(qtyInput.value);
    const qty = (isNaN(qtyRaw) || qtyRaw <= 0) ? 1 : qtyRaw;
    const baseCals = parseFloat(calsInput.value);
    const baseProtein = parseFloat(proteinInput.value);

    if(!name){ nameInput.focus(); return; }
    if(isNaN(baseCals) || baseCals < 0){ calsInput.focus(); return; }

    const finalCals = Math.round(baseCals * qty);
    const finalProtein = Math.round((isNaN(baseProtein) || baseProtein < 0 ? 0 : baseProtein) * qty);

    if(editingEntryId){
      const entry = entries.find(x => x.id === editingEntryId);
      if(entry){
        entry.name = name;
        entry.calories = finalCals;
        entry.protein = finalProtein;
      }
      editingEntryId = null;
      entryEditValues = {name:'', calories:'', protein:''};
      await saveEntries();
      render();
      showToast('Entry updated');
      return;
    }

    const displayName = qty !== 1 ? `${name} (\u00d7${qty})` : name;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      name: displayName,
      calories: finalCals,
      protein: finalProtein,
      time: new Date().toISOString()
    };
    entries.push(entry);
    await saveEntries();
    render();
    showToast(`Added ${name}`);
  }

  async function deleteEntry(id){
    entries = entries.filter(e => e.id !== id);
    if(editingEntryId === id){
      editingEntryId = null;
      entryEditValues = {name:'', calories:'', protein:''};
    }
    await saveEntries();
    render();
  }

  async function addExerciseEntry(){
    const nameInput = $('#exName');
    const calsInput = $('#exCals');
    const name = nameInput.value.trim();
    const cals = parseInt(calsInput.value, 10);

    if(!name){ nameInput.focus(); return; }
    if(isNaN(cals) || cals < 0){ calsInput.focus(); return; }

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      name,
      calories: cals,
      time: new Date().toISOString()
    };
    exerciseEntries.push(entry);
    await saveExerciseEntries();
    render();
    showToast(`Logged ${name}`);
  }

  async function deleteExerciseEntry(id){
    exerciseEntries = exerciseEntries.filter(e => e.id !== id);
    await saveExerciseEntries();
    render();
  }

  async function goToDate(newDate){
    currentDate = newDate;
    editingEntryId = null;
    entryEditValues = {name:'', calories:'', protein:''};
    main.innerHTML = '<div class="loading">Loading…</div>';
    await loadEntries();
    await loadExerciseEntries();
    render();
  }

  async function init(){
    try{
      localStorage.setItem(STORAGE_PREFIX + '__test__', '1');
      localStorage.removeItem(STORAGE_PREFIX + '__test__');
    }catch(e){
      main.innerHTML = '<div class="empty">Your browser is blocking local storage (common in Private Browsing mode), so entries can\'t be saved. Try opening this in a normal browser tab.</div>';
      return;
    }
    await loadSettings();
    await loadCustomFoods();
    await loadDaySummaries();
    await loadEntries();
    await loadExerciseEntries();
    render();
  }

  init();
})();
</script>
</body>
</html>
